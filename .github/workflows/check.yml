name: CPU Checks
on: [push, pull_request]
jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Embedded Engines
            features: duckdb-backend,datafusion-backend,polars-backend,sqlite-backend,arrow-backend,generate,download,perf-counters
          - name: Server Backends
            features: clickhouse-backend,postgres-backend,generate
          - name: UStore Documents
            features: ustore-backend,generate
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
      - name: Install Rust 1.100 with Rustfmt and Clippy
        run: rustup toolchain install 1.100 --profile minimal --component rustfmt,clippy
      - name: Lint ${{ matrix.name }}
        run: cargo clippy --locked --no-default-features --features '${{ matrix.features }}' --all-targets -- -D warnings
      - name: Test ${{ matrix.name }}
        run: cargo test --locked --no-default-features --features '${{ matrix.features }}' --all-targets
