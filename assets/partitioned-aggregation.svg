<rect x="420" y="768" width="260" height="28" fill="none" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="436" y="732" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">CMT</text>
<text x="664" y="732" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">40</text>
<text x="436" y="760" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">VTS</text>
<text x="664" y="760" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">59</text>
<text x="436" y="788" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">DDS</text>
<text x="664" y="788" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">3</text>
