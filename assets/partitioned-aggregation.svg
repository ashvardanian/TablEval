<text x="680" y="424" font-size="15" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">morsels 1, 4</text>
<path d="M268 370.0L410 417" stroke="#FFE6A7" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
<path d="M268 538.0L410 417" stroke="#FFE6A7" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
<rect x="420" y="440" width="260" height="28" fill="none" stroke="#FFE6A7" stroke-width="1.5"/>
<rect x="420" y="468" width="260" height="28" fill="none" stroke="#FFE6A7" stroke-width="1.5"/>
<rect x="420" y="496" width="260" height="28" fill="none" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="436" y="460" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">CMT</text>
<text x="664" y="460" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">38</text>
<text x="436" y="488" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">VTS</text>
<text x="664" y="488" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">60</text>
<text x="436" y="516" font-size="15" fill="#FFE6A7" opacity="0.6">no DDS rows</text>
<rect x="420" y="542" width="22" height="22" fill="url(#rows)" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="454" y="560" font-size="18" fill="#FFE6A7">thread 2</text>
<text x="680" y="560" font-size="15" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">morsels 2, 7</text>
