<text x="664" y="324" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">41</text>
<text x="436" y="352" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">VTS</text>
<text x="664" y="352" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">57</text>
<text x="436" y="380" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">DDS</text>
<text x="664" y="380" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">2</text>
<rect x="420" y="406" width="22" height="22" fill="url(#dots)" stroke="#FFE6A7" stroke-width="1.5"/>
