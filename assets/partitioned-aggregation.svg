<rect width="1600" height="920" fill="#C44536"/>
<g id="partitioned-aggregation" font-family="Poppins, Helvetica, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="70" y="58" font-size="20" fill="#FFE6A7">TablEval / analytics notes</text>
<text x="70" y="140" font-size="54" fill="#FFE6A7">Count in parallel, then merge once.</text>
<text x="70" y="200" font-size="23" fill="#FFE6A7">A GROUP BY splits the table into morsels, counts each one into a private table per thread, then merges.</text>
<text x="70" y="262" font-size="19" fill="#FFE6A7">morsels</text>
