<text x="830" y="470" font-size="18" fill="#FFE6A7">merged counts</text>
<rect x="830" y="486" width="240" height="28" fill="none" stroke="#FFE6A7" stroke-width="2.5"/>
<text x="846" y="506" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">CMT</text>
<text x="1054" y="506" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">164</text>
<rect x="830" y="514" width="240" height="28" fill="none" stroke="#FFE6A7" stroke-width="2.5"/>
<text x="846" y="534" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">VTS</text>
<text x="1054" y="534" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">228</text>
<rect x="830" y="542" width="240" height="28" fill="none" stroke="#FFE6A7" stroke-width="2.5"/>
<text x="846" y="562" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">DDS</text>
<text x="1054" y="562" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">6</text>
<text x="830" y="604" font-size="16" fill="#FFE6A7" opacity="0.8">one sum per key</text>
<path d="M1140 270V776" stroke="#FFE6A7" stroke-width="1.5" opacity="0.4"/>
<text x="1180" y="300" font-size="20" fill="#FFE6A7">Averages merge as pairs.</text>
<text x="1180" y="338" font-size="17" fill="#FFE6A7">Each thread keeps a (sum, count)</text>
<text x="1180" y="364" font-size="17" fill="#FFE6A7">pair per key, never a finished mean.</text>
<text x="1180" y="430" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">thread 0</text>
<text x="1300" y="430" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">sum 10</text>
<text x="1410" y="430" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">count 1</text>
<text x="1180" y="462" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">thread 1</text>
<text x="1300" y="462" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">sum 60</text>
<text x="1410" y="462" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">count 3</text>
<path d="M1180 484H1530" stroke="#FFE6A7" stroke-width="1.5" opacity="0.6"/>
<text x="1180" y="518" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">merged</text>
<text x="1300" y="518" font-size="16" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">70 / 4 = 17.5</text>
<text x="1180" y="580" font-size="17" fill="#FFE6A7">Averaging the two means</text>
<text x="1180" y="606" font-size="17" fill="#FFE6A7">gives (10 + 20) / 2 = 15,</text>
<text x="1180" y="632" font-size="17" fill="#FFE6A7">which ignores row counts.</text>
<path d="M70 838H1530" stroke="#FFE6A7" stroke-width="1.5" opacity="0.6"/>
<text x="70" y="880" font-size="18" fill="#FFE6A7">Fill shows which thread took each morsel. Threads take the next free morsel, so the split varies from run to run.</text>
</g>
</svg>
