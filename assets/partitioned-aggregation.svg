<path d="M268 594.0L410 281" stroke="#FFE6A7" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
<rect x="420" y="304" width="260" height="28" fill="none" stroke="#FFE6A7" stroke-width="1.5"/>
<rect x="420" y="332" width="260" height="28" fill="none" stroke="#FFE6A7" stroke-width="1.5"/>
