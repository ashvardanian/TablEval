<text x="436" y="624" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">VTS</text>
<text x="664" y="624" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">52</text>
<text x="436" y="652" font-size="17" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">DDS</text>
<text x="664" y="652" font-size="17" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">1</text>
<rect x="420" y="678" width="22" height="22" fill="#FFE6A7" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="454" y="696" font-size="18" fill="#FFE6A7">thread 3</text>
<text x="680" y="696" font-size="15" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">morsels 3, 6</text>
<path d="M268 482.0L410 689" stroke="#FFE6A7" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
<path d="M268 650.0L410 689" stroke="#FFE6A7" stroke-width="1.5" opacity="0.55" marker-end="url(#arrow)"/>
