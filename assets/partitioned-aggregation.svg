<text x="96" y="600" font-size="16" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">5</text>
<rect x="110" y="570" width="150" height="48" fill="url(#hatch)" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="96" y="656" font-size="16" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">6</text>
<rect x="110" y="626" width="150" height="48" fill="#FFE6A7" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="96" y="712" font-size="16" text-anchor="end" fill="#FFE6A7" font-family="Red Hat Mono, ui-monospace, monospace">7</text>
