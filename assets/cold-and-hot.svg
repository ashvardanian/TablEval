<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>The first run pays to warm the caches.</title>
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <path d="M0 0V6" stroke="#FFE6A7" stroke-width="2"/>
</pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
  <circle cx="3" cy="3" r="1.3" fill="#FFE6A7"/>
</pattern>
<pattern id="rows" width="6" height="6" patternUnits="userSpaceOnUse">
  <path d="M0 3H6" stroke="#FFE6A7" stroke-width="1.6"/>
</pattern>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
  <path d="M0 0L12 6L0 12Z" fill="#FFE6A7"/>
</marker>
</defs>
<rect width="1600" height="920" fill="#C44536"/>
<g id="cold-and-hot" font-family="Poppins, Helvetica, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="70" y="58" font-size="20" fill="#FFE6A7">TablEval / analytics notes</text>
<text x="70" y="140" font-size="54" fill="#FFE6A7">The first run pays to warm the caches.</text>
<text x="70" y="200" font-size="23" fill="#FFE6A7">TablEval reports the cold run apart from the hot repetitions that follow it.</text>
<path d="M230 250V760" stroke="#FFE6A7" stroke-width="2"/>
<path d="M230 760H1020" stroke="#FFE6A7" stroke-width="2"/>
<text transform="translate(206 250) rotate(-90)" font-size="18" text-anchor="end" fill="#FFE6A7">wall time per run</text>
<rect x="260" y="630" width="140" height="130" fill="#FFE6A7" stroke="#FFE6A7" stroke-width="2"/>
<rect x="260" y="580" width="140" height="50" fill="url(#rows)" stroke="#FFE6A7" stroke-width="2"/>
<rect x="260" y="460" width="140" height="120" fill="url(#hatch)" stroke="#FFE6A7" stroke-width="2"/>
<rect x="260" y="300" width="140" height="160" fill="url(#dots)" stroke="#FFE6A7" stroke-width="2"/>
<rect x="510" y="632" width="140" height="128" fill="#FFE6A7" stroke="#FFE6A7" stroke-width="2"/>
<rect x="680" y="636" width="140" height="124" fill="#FFE6A7" stroke="#FFE6A7" stroke-width="2"/>
<rect x="850" y="629" width="140" height="131" fill="#FFE6A7" stroke="#FFE6A7" stroke-width="2"/>
<text x="330.0" y="794" font-size="18" text-anchor="middle" fill="#FFE6A7">cold run</text>
<path d="M510 774V782H990V774" stroke="#FFE6A7" stroke-width="1.5"/>
<path d="M750 782V788" stroke="#FFE6A7" stroke-width="1.5"/>
<text x="750" y="806" font-size="18" text-anchor="middle" fill="#FFE6A7">hot runs</text>
<path d="M408 380.0H1046" stroke="#FFE6A7" stroke-width="1.5" opacity="0.7" stroke-dasharray="4 6"/>
<circle cx="1046" cy="380.0" r="4" fill="#FFE6A7"/>
<text x="1060" y="376.0" font-size="20" fill="#FFE6A7">Page-cache misses</text>
<text x="1060" y="402.0" font-size="16" fill="#FFE6A7" opacity="0.85">Parquet pages come from disk, not memory.</text>
<path d="M408 520.0H1046" stroke="#FFE6A7" stroke-width="1.5" opacity="0.7" stroke-dasharray="4 6"/>
<circle cx="1046" cy="520.0" r="4" fill="#FFE6A7"/>
<text x="1060" y="516.0" font-size="20" fill="#FFE6A7">Parquet decode</text>
<text x="1060" y="542.0" font-size="16" fill="#FFE6A7" opacity="0.85">Pages are decompressed and unpacked into columns.</text>
<path d="M408 605.0H1046" stroke="#FFE6A7" stroke-width="1.5" opacity="0.7" stroke-dasharray="4 6"/>
<circle cx="1046" cy="605.0" r="4" fill="#FFE6A7"/>
<text x="1060" y="601.0" font-size="20" fill="#FFE6A7">Plan compilation</text>
<text x="1060" y="627.0" font-size="16" fill="#FFE6A7" opacity="0.85">The query is parsed, optimized and planned.</text>
<path d="M998 694.5H1046" stroke="#FFE6A7" stroke-width="1.5" opacity="0.7" stroke-dasharray="4 6"/>
<circle cx="1046" cy="694.5" r="4" fill="#FFE6A7"/>
<text x="1060" y="690.5" font-size="20" fill="#FFE6A7">Query execution</text>
<text x="1060" y="716.5" font-size="16" fill="#FFE6A7" opacity="0.85">Every run pays this part.</text>
<text x="510" y="272" font-size="18" fill="#FFE6A7">Hot runs reuse what the cold run left behind:</text>
<text x="510" y="302" font-size="17" fill="#FFE6A7" opacity="0.85">pages stay in the page cache,</text>
<text x="510" y="328" font-size="17" fill="#FFE6A7" opacity="0.85">decoded columns stay in memory,</text>
<text x="510" y="354" font-size="17" fill="#FFE6A7" opacity="0.85">and some engines keep the plan.</text>
<path d="M70 838H1530" stroke="#FFE6A7" stroke-width="1.5" opacity="0.6"/>
<text x="70" y="880" font-size="18" fill="#FFE6A7">Schematic heights, not measurements. How the cold cost splits depends on the engine and the storage.</text>
</g>
</svg>
