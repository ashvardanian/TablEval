# The server `tabl-eval-postgres` starts, for manual runs: docker compose -f docker/postgres.yml up
services:
  postgres:
    image: postgres:18.6
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - dynamic_shared_memory_type=mmap
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_PASSWORD: tableval
      POSTGRES_DB: tableval
    ports: ["127.0.0.1::5432"]
